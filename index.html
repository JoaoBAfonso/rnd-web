<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CymaForma RND</title>
<style>
  :root { color-scheme: dark; --bg:#101214; --panel:#1D2125; --gray:#252A2E; --line:#34383D; --accent:#E66B4E; --accent2:#F07B5E; --teal:#55C6B3; --text:#E6E9E8; --muted:#929A9E; --ink:#17191C; }
  * { box-sizing: border-box; min-width: 0; }
  html { overflow-x: hidden; }
  select { max-width: 100%; }
  .track button#fol1, .track button[id^=fol] { padding: 4px 6px; font-size: 10px; flex: none; }
  input:not([type=range]) { max-width: 100%; }
  body { margin: 0; font: 14px/1.3 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 8px 10px 24px; display: flex; flex-direction: column; gap: 10px; }
  header, section { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 14px; }
  header { background: var(--ink); }
  .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
  .head .logo { width: 250px; max-width: 100%; height: auto; }
  .conn { flex: 1 1 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; text-align: center; }
  .conn .row { justify-content: center; }
  .conn select { max-width: 46%; }
  .conn { position: relative; }
  .conn > button#midiBtn { background: var(--gray); color: var(--accent); border-width: 1px; border-radius: 12px; }
  .conn > button#midiBtn.on { color: var(--teal); background: var(--gray); border-color: var(--teal); }
  .corner { position: absolute; right: 8px; bottom: 8px; min-height: 26px !important; padding: 2px 8px !important; border-radius: 8px; background: var(--gray); }
  #scrim { position: fixed; inset: 0; background: rgba(8,10,12,.62); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 12px; }
  #scrim[hidden], #blank[hidden] { display: none; }
  .modal { width: min(440px, 100%); max-height: 92vh; overflow: auto; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px 18px 16px; }
  .modal select { width: 100%; margin-bottom: 8px; }
  .mtitle { display: flex; justify-content: space-between; align-items: center; }
  .mtitle h2 { font-size: 14px; margin: 0; }
  .x { border: 0 !important; font-size: 20px !important; padding: 0 8px !important; }
  .lbl2 { font-weight: 700; font-size: 11px; letter-spacing: .08em; margin: 8px 0 3px; }
  #blank { position: fixed; inset: 0; background: var(--bg); z-index: 9; padding: 24px 20px; }
  #home { background: var(--gray); border-color: var(--gray); }
  .logo-ba { width: 170px; max-width: 80%; height: auto; margin-top: 4px; }
  h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .row > label, .lbl { color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  select, input:not([type=range]):not([type=file]), button { background: var(--gray); color: var(--text); border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; font: 700 12px "Segoe UI", system-ui, sans-serif; letter-spacing: .04em; }
  select { padding-right: 6px; }
  input:not([type=range]) { font-weight: 400; }
  button { background: transparent; cursor: pointer; text-transform: uppercase; min-height: 38px; }
  button:active { background: var(--gray); }
  button.on { background: var(--accent); border-color: var(--accent2); color: var(--ink); }
  button:disabled { opacity: .45; }
  button.primary { background: var(--accent); border-color: var(--accent2); color: var(--ink); }
  #random { width: 100%; height: 96px; font-size: 20px; letter-spacing: .14em; border-radius: 18px; background: var(--accent); border-color: var(--accent2); color: var(--ink); }
  #random:active { background: var(--accent2); }
  label.s { display: grid; grid-template-columns: 84px 1fr 44px; gap: 8px; align-items: center; width: 100%; color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  label.s span { color: var(--text); text-align: right; font-weight: 400; }
  label.s select { grid-column: 2 / 4; }
  input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .tracks { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .track { background: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; }
  .track b { color: var(--accent); font-size: 16px; width: 14px; text-align: center; }
  .trow { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .trow select { flex: 1; min-width: 0; }
  .grow { flex: 1; }
  .track:nth-child(2) b { color: var(--teal); } .track:nth-child(3) b { color: #A58BDB; } .track:nth-child(4) b { color: #E0B45C; }
  .track button { min-height: 32px; padding: 4px 10px; }
  #log { color: var(--teal); font: 12px Consolas, monospace; white-space: pre-wrap; max-height: 150px; overflow: auto; }
  .info { color: var(--teal); font-weight: 400; }
  #kb { position: relative; height: 122px; user-select: none; touch-action: none; }
  #kb .k { position: absolute; top: 0; height: 100%; border: 1px solid var(--line); border-radius: 0 0 6px 6px; background: #D7DEDB; color: var(--ink); display: flex; align-items: flex-end; justify-content: center; font-size: 10px; padding-bottom: 4px; }
  #kb .k.b { height: 62%; background: #17191C; color: var(--text); z-index: 2; border-radius: 0 0 5px 5px; }
  #kb .k.sel { box-shadow: inset 0 0 0 2px #E0B45C; }
  #kb .k.down { background: var(--accent); color: var(--ink); }
  #meters { display: grid; grid-template-columns: 1fr; gap: 6px; max-width: 100px; }
  .m { background: var(--ink); border-radius: 6px; height: 70px; position: relative; overflow: hidden; }
  .m i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--teal); height: 0; }
  .m span { position: absolute; top: 2px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); }
  #scope { width: min(560px, 100%); height: 120px; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; }
  #scopeDb { font-size: 30px; font-weight: bold; }
  button.rec { background: #a3302a; border-color: #c0443d; color: #fff; }

  /* ---- Polish ---- */
  :root { --glow: 0 0 0 1px rgba(230,107,78,.25), 0 6px 22px rgba(230,107,78,.22); --r: 18px; }
  body { background: radial-gradient(1200px 500px at 50% -120px, #1c1f23 0%, var(--bg) 60%) fixed; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  main { gap: 12px; padding: 12px 12px 32px; }
  header, section { background: linear-gradient(180deg, #21262a 0%, var(--panel) 100%); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); padding: 12px 16px; }
  header { background: linear-gradient(180deg, #1b1e21 0%, var(--ink) 100%); }
  .conn { background: linear-gradient(180deg, #21262a, var(--panel)); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .head .logo { filter: drop-shadow(0 4px 14px rgba(230,107,78,.35)); }
  h2 { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .18em; margin-bottom: 8px; }
  h2::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, var(--accent2), var(--accent)); }
  .mtitle h2 { margin: 0; }
  hr { border-top-color: rgba(255,255,255,.07); margin: 10px 0; }
  .lbl, .row > label, label.s, .lbl2 { letter-spacing: .12em; }

  button, select, input:not([type=range]):not([type=file]) { transition: background .15s, border-color .15s, color .15s, transform .08s, box-shadow .15s; }
  button { border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0)); }
  button:hover:not(:disabled) { border-color: #4a5057; background-color: var(--gray); }
  button:active:not(:disabled) { transform: scale(.96); }
  button.on, button.primary { background: linear-gradient(180deg, var(--accent2), var(--accent)); border-color: var(--accent2); color: var(--ink); box-shadow: 0 4px 14px rgba(230,107,78,.3); }
  button.on:hover:not(:disabled), button.primary:hover:not(:disabled) { background-color: transparent; border-color: #f59a82; }
  select { appearance: none; -webkit-appearance: none; padding: 8px 30px 8px 12px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23E66B4E' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 11px center; }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:not([type=range]):focus { border-color: var(--accent); }

  #random { height: 104px; font-size: 22px; letter-spacing: .22em; border-radius: 20px; background: linear-gradient(180deg, #F2825F, var(--accent) 55%, #D65B40); box-shadow: 0 10px 28px rgba(230,107,78,.35), inset 0 1px 0 rgba(255,255,255,.3); border: 2px solid var(--accent2); text-shadow: 0 1px 0 rgba(255,255,255,.25); }
  #random:hover:not(:disabled) { box-shadow: 0 12px 34px rgba(230,107,78,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  #random:active:not(:disabled) { transform: scale(.985); }

  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 28px; --p: 50%; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p), #2c3136 var(--p)); box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #2c3136; }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0%, #f3d9d1 35%, #E6A08E 100%); border: 2px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #f3d9d1; border: 2px solid var(--accent); }
  input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(230,107,78,.25), 0 2px 8px rgba(0,0,0,.5); }
  input[type=range]:disabled { opacity: .45; }
  label.s span { font: 600 12px Consolas, monospace; color: var(--text); }

  .track { background: linear-gradient(180deg, #181b1e, var(--ink)); border-radius: 16px; padding: 10px 12px; border-left: 3px solid var(--tc, var(--accent)); }
  .track:nth-child(1) { --tc: var(--accent); } .track:nth-child(2) { --tc: var(--teal); } .track:nth-child(3) { --tc: #A58BDB; } .track:nth-child(4) { --tc: #E0B45C; }
  .track b { color: var(--tc); font-size: 18px; text-shadow: 0 0 12px var(--tc); }
  .track input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, var(--tc) var(--p), #2c3136 var(--p)); }
  .track input[type=range]::-webkit-slider-thumb { border-color: var(--tc); }
  .track button.on { background: linear-gradient(180deg, var(--tc), var(--tc)); border-color: var(--tc); }
  .track button { border-radius: 10px; }

  #kb { height: 128px; padding: 0; border-radius: 0 0 12px 12px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  #kb .k { background: linear-gradient(180deg, #EEF2F0, #CBD3D0); border-color: #9aa3a0; transition: background .06s; }
  #kb .k.b { background: linear-gradient(180deg, #2b3035, #0f1113); border-color: #000; }
  #kb .k.down { background: linear-gradient(180deg, var(--accent2), var(--accent)); }
  #kb .k.b.down { background: linear-gradient(180deg, #c75a40, #8f3a28); }
  #kb .k.sel { box-shadow: inset 0 -4px 0 #E0B45C; }

  #scope { background: radial-gradient(circle at 50% 50%, #1c2024, #121416); border-color: #2a2f34; border-radius: 14px; box-shadow: inset 0 2px 8px rgba(0,0,0,.5); }
  #scopeDb { font: 700 30px Consolas, monospace; text-shadow: 0 0 14px rgba(85,198,179,.5); }
  .m { background: linear-gradient(180deg, #121416, var(--ink)); border: 1px solid var(--line); }
  .m i { background: linear-gradient(0deg, var(--teal), #8ee0d1); box-shadow: 0 0 10px rgba(85,198,179,.5); }
  button.rec { background: linear-gradient(180deg, #d4413a, #a3302a); border-color: #e0605a; color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(212,65,58,.55); } 50% { box-shadow: 0 0 0 8px rgba(212,65,58,0); } }
  #log { background: #121416; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

  #scrim { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .15s; }
  .modal { background: linear-gradient(180deg, #24292d, var(--panel)); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.6); animation: pop .18s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  #midiBtn { min-width: 120px; }
  #midiBtn.on { box-shadow: 0 0 14px rgba(85,198,179,.35); }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #3a4046; border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 420px) { main { padding: 8px 8px 24px; } header, section { padding: 10px 12px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }  label.s { grid-template-columns: 100px 1fr 44px; white-space: nowrap; }
  #presetSel { min-width: 150px; }

  /* ---- Fundo 3D ---- */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; }
  header, section { background: linear-gradient(180deg, rgba(33,38,42,.50) 0%, rgba(29,33,37,.40) 100%); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border-color: rgba(255,255,255,.08); }
  header { background: linear-gradient(180deg, rgba(27,30,33,.5), rgba(23,25,28,.4)); }
  .conn { background: rgba(29,33,37,.6); }
  .track { background: rgba(17,19,21,.62); }
  #log { background: rgba(14,16,18,.7); }
  body { background: #0b0d0f; }</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<header>
  <div class="head">
    <img class="logo" src="logo-unrnd.png" alt="unRND - Cymaforma RND Performance Controller">
    <div class="conn">
      <button id="midiBtn">○ MIDI</button>
      <div id="recInfo" class="info">Fonte de áudio não selecionada.</div>
      <img class="logo-ba" src="logo-ba.png" alt="Bernardo Afonso">
      <button id="openBlank" class="corner" title="Página em branco">↗</button>
    </div>
  </div>
</header>

<div id="scrim" hidden>
  <div class="modal">
    <div class="mtitle"><h2>Ligação MIDI</h2><button id="modalClose" class="x">✕</button></div>
    <div class="info" id="status">Sem ligação.</div>
    <div class="lbl2">IN</div>
    <select id="inSel"></select>
    <div class="lbl2">OUT</div>
    <select id="outSel"></select>
    <div class="row">
      <button id="refresh">Refresh</button>
      <button id="connect" class="primary">Connect</button>
      <button id="sync">Sincronizar</button>
    </div>
    <hr>
    <h2>Track Activity</h2>
    <select id="audioSel"></select>
    <div class="row">
      <button id="audioConnect" class="primary">Ligar áudio</button>
      <button id="refreshAudio">Refresh audio</button>
    </div>
  </div>
</div>

<div id="blank" hidden><button id="home">←  Home</button></div>

<section>
  <button id="random">Random<br>RND</button>
  <div class="row"><span class="lbl">Seed</span> <span class="info" id="seed">—</span> <input id="seedIn" size="8" placeholder="Seed (hex)"> <button id="seedSend">Enviar seed</button></div>
  <hr>
  <div class="row">
    <span class="lbl">Nº Faixas</span>
    <select id="trackCount"><option>Auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
    <span id="active">Ativas: —</span>
  </div>
  <div class="row">
    <span class="lbl">Type</span>
    <span class="row" id="types" style="margin:0"></span>
    <button id="lockType" class="lock">Lock</button>
  </div>
  <hr>
  <div class="row">
    <label class="s grow">Scale <select id="scale"></select></label>
    <button id="lockScale" class="lock">Lock</button>
  </div>
  <hr>
  <label class="s">BPM <input id="bpm" type="range" min="20" max="400" value="120"><span id="bpmV">120</span></label>
  <hr>
  <label class="s">All Reverb <input data-ch="0" data-cc="91" type="range" min="0" max="127"><span></span></label>
  <label class="s">All Volume <input data-ch="0" data-cc="7" type="range" min="0" max="127"><span></span></label>
  <div class="tracks" id="tracks"></div>
</section>

<section>
  <h2>Presets</h2>
  <div class="row">
    <select id="presetSel"></select>
    <button id="presetRecall">Recall</button>
    <button id="presetDelete">Del</button>
  </div>
  <div class="row">
    <input id="presetName" size="12" placeholder="Nome do preset">
    <button id="presetSave">Save</button>
    <button id="presetExport">Exportar</button>
    <button id="presetImport">Importar</button>
    <input id="presetFile" type="file" accept="application/json" hidden>
  </div>
</section>

<section>
  <div class="row">
    <button id="kbHold">Hold off</button>
    <button id="tStart">Start</button>
    <button id="tStop">Stop</button>
    <button id="lockKey">Lock Key</button>
  </div>
  <div class="row">
    <span class="lbl">Midi Ch</span>
    <span class="row" id="kbChs" style="margin:0"></span>
    <button id="rec" disabled>● REC</button>
  </div>
  <div class="row">
    <button id="octDn">Oct -</button><button id="octUp">Oct +</button>
    <button id="noteDn">Note -</button><button id="noteUp">Note +</button>
    <span class="info" id="kbRange"></span>
  </div>
  <div id="kb"></div>
</section>

<section>
  <h2>Scope</h2>
  <div class="row"><canvas id="scope"></canvas><span id="scopeDb" class="info">—</span></div>
  <div id="meters"></div>
</section>

<section><h2>Log</h2><div id="log"></div></section>
</main>

<script>
const ENGINES = ["Subtractive","FM","Acid (303)","Noise","Speech","Plucked String","SuperSaw","Harmonic"];
const engineNames = ["—", "—", "—", "—"];
function getEngine(i) { return engineNames[i]; }
function refreshActive() {
  const n = engineNames.filter(e => ENGINES.includes(e)).length;
  $("active").textContent = "Ativas: " + (n || "—");
}
function setEngine(i, name) {
  engineNames[i] = ENGINES.includes(name) ? name : "—";
  $("eng" + (i + 1)).value = engineNames[i];
  refreshActive();
}
const PATCH_TYPES = ["Sequence", "Drone", "Jingles"];
const SCALES = ["Random","Major","Minor","Harmonic Minor","Blues","Major Pentatonic","Minor Pentatonic","Dorian","Phrygian","Lydian","Mixolydian","Locrian","Whole Tone","Double Harmonic","Hungarian Minor","Phrygian Dominant","Hirajoshi","In Sen","Prometheus","Octatonic","Persian"];
const HDR = [0x6F, 0x62, 0x78];
let access = null, midiIn = null, midiOut = null;
const $ = id => document.getElementById(id);
const log = t => { const l = $("log"); l.textContent = (t + "\n" + l.textContent).slice(0, 4000); };
const dec7 = bytes => bytes.reduce((a, b, i) => a + ((b & 0x7F) << (7 * i)), 0);

const sliders = {};
const mix = {
  vol: [null, null, null, null], muted: [false, false, false, false], follow: [null, null, null, null],
  solo: null, soloPrev: null, soloUntil: 0, pendingFollow: null, pendingFollowUntil: 0, echoes: [],
};
const now = () => performance.now();
function registerEcho(ch, v) { mix.echoes.push({ ch, v, until: now() + 1000 }); }
function consumeEcho(ch, v) {
  mix.echoes = mix.echoes.filter(e => e.until > now());
  const i = mix.echoes.findIndex(e => e.ch === ch && e.v === v);
  if (i < 0) return false;
  mix.echoes.splice(i, 1); return true;
}
function bindSlider(input, val, ch, cc) {
  input.oninput = () => { val.textContent = input.value; userSlider(ch, cc, +input.value); };
  sliders[ch + ":" + cc] = { input, val };
}
function mkSlider(host, ch, cc, label) {
  const el = document.createElement("label");
  el.className = "s";
  el.innerHTML = `${label}<input type="range" min="0" max="127"><span>0</span>`;
  bindSlider(el.querySelector("input"), el.querySelector("span"), ch, cc);
  host.appendChild(el);
}
document.querySelectorAll("[data-ch]").forEach(input => bindSlider(input, input.nextElementSibling, +input.dataset.ch, +input.dataset.cc));
for (let t = 1; t <= 4; t++) {
  const d = document.createElement("div");
