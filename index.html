<script>
const ENGINES = ["Subtractive","FM","Acid (303)","Noise","Speech","Plucked String","SuperSaw","Harmonic"];
const engineNames = ["—", "—", "—", "—"];
function getEngine(i) { return engineNames[i]; }
function refreshActive() {
  const n = engineNames.filter(e => ENGINES.includes(e)).length;
  $("active").textContent = "Ativas: " + (n || "—");
}
function setEngine(i, name) {
  engineNames[i] = ENGINES.includes(name) ? name : "—";
  $("eng" + (i + 1)).value = engineNames[i];
  refreshActive();
}
const PATCH_TYPES = ["Sequence", "Drone", "Jingles"];
const SCALES = ["Random","Major","Minor","Harmonic Minor","Blues","Major Pentatonic","Minor Pentatonic","Dorian","Phrygian","Lydian","Mixolydian","Locrian","Whole Tone","Double Harmonic","Hungarian Minor","Phrygian Dominant","Hirajoshi","In Sen","Prometheus","Octatonic","Persian"];
const HDR = [0x6F, 0x62, 0x78];
let access = null, midiIn = null, midiOut = null;
const $ = id => document.getElementById(id);
const log = t => { const l = $("log"); l.textContent = (t + "\n" + l.textContent).slice(0, 4000); };
const dec7 = bytes => bytes.reduce((a, b, i) => a + ((b & 0x7F) << (7 * i)), 0);

const sliders = {};
const mix = {
  vol: [null, null, null, null], muted: [false, false, false, false], follow: [null, null, null, null],
  solo: null, soloPrev: null, soloUntil: 0, pendingFollow: null, pendingFollowUntil: 0, echoes: [],
};
const now = () => performance.now();
function registerEcho(ch, v) { mix.echoes.push({ ch, v, until: now() + 1000 }); }
function consumeEcho(ch, v) {
  mix.echoes = mix.echoes.filter(e => e.until > now());
  const i = mix.echoes.findIndex(e => e.ch === ch && e.v === v);
  if (i < 0) return false;
  mix.echoes.splice(i, 1); return true;
}
function bindSlider(input, val, ch, cc) {
  input.oninput = () => { val.textContent = input.value; userSlider(ch, cc, +input.value); };
  sliders[ch + ":" + cc] = { input, val };
}
function mkSlider(host, ch, cc, label) {
  const el = document.createElement("label");
  el.className = "s";
  el.innerHTML = `${label}<input type="range" min="0" max="127"><span>0</span>`;
  bindSlider(el.querySelector("input"), el.querySelector("span"), ch, cc);
  host.appendChild(el);
}
document.querySelectorAll("[data-ch]").forEach(input => bindSlider(input, input.nextElementSibling, +input.dataset.ch, +input.dataset.cc));
for (let t = 1; t <= 4; t++) {
  const d = document.createElement("div");
  d.className = "track";
  d.innerHTML = `<div class="trow"><b>${t}</b><button id="solo${t}">S</button><button id="mute${t}">M</button>
    <select id="eng${t}"><option>—</option>${ENGINES.map(e => `<option>${e}</option>`).join("")}</select>
    <button id="fol${t}">N/D</button></div>`;
  mkSlider(d, t, 91, "Reverb");
  mkSlider(d, t, 7, "Volume");
  $("tracks").appendChild(d);
  $("eng" + t).onchange = () => {
    const v = $("eng" + t).value;
    if (!midiOut) { log("Ligue uma saída MIDI antes de alterar o engine."); setEngine(t - 1, getEngine(t - 1)); return; }
    if (ENGINES.includes(v)) { sendSysex([0x1B, t - 1, ...Array.from(v, c => c.charCodeAt(0)), 0]); engineNames[t - 1] = v; }
    refreshActive();
  };
  $("mute" + t).onclick = () => toggleMute(t - 1);
  $("solo" + t).onclick = () => toggleSolo(t - 1);
  $("fol" + t).onclick = () => toggleFollow(t - 1);
}
function setSlider(ch, cc, v) {
  const s = sliders[ch + ":" + cc];
  if (s) { s.input.value = v; s.val.textContent = v; }
}
function renderTrack(t) {
  const shown = mix.muted[t] ? 0 : mix.vol[t];
  if (shown != null) setSlider(t + 1, 7, shown);
  $("mute" + (t + 1)).classList.toggle("on", mix.muted[t]);
  $("solo" + (t + 1)).classList.toggle("on", mix.solo === t);
  const f = $("fol" + (t + 1));
  f.classList.toggle("on", mix.follow[t] === true);
  f.textContent = mix.follow[t] === true ? "Follow ✓" : mix.follow[t] === false ? "Follow" : "N/D";
}
const renderAll = () => [0, 1, 2, 3].forEach(renderTrack);
function userSlider(ch, cc, v) {
  if (cc === 7 && ch >= 1) {
    const t = ch - 1;
    mix.vol[t] = v;
    if (mix.muted[t] && mix.solo === null) mix.muted[t] = false;
    if (mix.solo !== null && mix.solo !== t) { renderTrack(t); return; }
    renderTrack(t);
    sendCC(ch, 7, mix.muted[t] ? 0 : v);
    return;
  }
  if (cc === 91) {
    if (ch === 0) { registerEcho(0, v); mix.follow = [true, true, true, true]; }
    else mix.follow[ch - 1] = false;
    renderAll();
  }
  sendCC(ch, cc, v);
}
function toggleMute(t) {
  if (!midiOut) return;
  if (mix.solo !== null && mix.solo !== t) { log("O mute está controlado pelo solo; desative o solo primeiro."); return; }
  if (mix.vol[t] == null) { log(`Volume da faixa ${t + 1} ainda não recebido.`); return; }
  mix.muted[t] = !mix.muted[t];
  if (mix.solo === t && mix.soloPrev) mix.soloPrev[t] = mix.muted[t];
  sendCC(t + 1, 7, mix.muted[t] ? 0 : mix.vol[t]);
  renderTrack(t);
}
function toggleSolo(t) {
  if (!midiOut) return;
  if (mix.vol.some(v => v == null)) { log("Aguarde a receção dos volumes das quatro faixas antes do solo."); return; }
  const off = mix.solo === t;
  const desired = off ? (mix.soloPrev || [false, false, false, false]) : [true, true, true, true].map((m, i) => i !== t);

    const sh = document.createElement("span"); sh.className = "shock"; rnd.appendChild(sh);
    sh.animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(22)", opacity: 0 }], { duration: 700, easing: "ease-out" }).onfinish = () => sh.remove();
    for (let i = 0; i < 22; i++) {
      const p = document.createElement("span"); p.className = "pt"; p.style.background = COLS[i % COLS.length]; rnd.appendChild(p);
      const a = Math.random() * 6.283, d = 60 + Math.random() * 150;
      p.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d * .5}px) scale(0)`, opacity: 0 }], { duration: 600 + Math.random() * 400, easing: "cubic-bezier(.1,.7,.3,1)" }).onfinish = () => p.remove();
    }
  });
  const TN = ["SEQUENCE", "DRONE", "JINGLES"], chM = $("chMidi"), chT = $("chType"), chB = $("chBpm"), hud = $("hudMode");
  const setChip = (el, txt, on) => { const t = el.lastChild; if (t.nodeValue !== txt) t.nodeValue = txt; el.classList.toggle("on", !!on); };
  setInterval(() => {
    const on = $("midiBtn").classList.contains("on");
    setChip(chM, on ? "MIDI ONLINE" : "MIDI OFF", on);
    setChip(chT, TN[state.type] || "SEQUENCE" , false);
    setChip(chB, $("bpm").value + " BPM", false);
    const m = SCOPE_MODES[scopeMode].toUpperCase(); if (hud.textContent !== m) hud.textContent = m;
  }, 250);
})();</script>
